name: release

on:
  workflow_dispatch:
  push:
    tags:
      - '*'

permissions:
  contents: write

env:
  MODRINTH_API_TOKEN: ${{ secrets.MODRINTH_API_TOKEN }}
  # TODO: Add curseforge page
  TEST_PUBLISHING_WITH_MR_STAGING: ${{ vars.TEST_PUBLISHING_WITH_MR_STAGING }}
  ENABLE_PUBLISHING: ${{ vars.ENABLE_PUBLISHING }}

jobs:
  build:
    uses: ./.github/workflows/build_reusable.yml

  prepare:
    name: Prepare Release
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write

    outputs:
      publish_github: ${{ steps.read-props.outputs.publish_github }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare git-cliff
        run: |
          REPO_URL="https://github.com/${{ github.repository }}"
          sed -i "s|%%%repo_url%%%|${REPO_URL}|g" cliff.toml

      - name: Generate changelog with git-cliff
        id: cliff
        uses: orhun/git-cliff-action@v4
        with:
          args: --latest --strip header --output CHANGELOG.md
          version: 'v2.10.1'

      - name: Read gradle.properties & stonecutter.properties.toml values
        id: read-props
        run: |
          VERSION=$(grep '^mod.version=' stonecutter.properties.toml | cut -d'=' -f2)
          VERSION="${VERSION//\"/}"
          CHANNEL_TAG=$(grep '^mod.channel_tag=' stonecutter.properties.toml | cut -d'=' -f2)
          CHANNEL_TAG="${CHANNEL_TAG//\"/}"
          PUBLISH_GITHUB=$(grep '^publish.github=' gradle.properties | cut -d'=' -f2 || echo "false")
          FULL_VERSION="${VERSION}${CHANNEL_TAG}"

          echo "mod.version=$VERSION"
          echo "mod.channel_tag=$CHANNEL_TAG"
          echo "Combined version=$FULL_VERSION"

          echo "publish_github=$PUBLISH_GITHUB" >> "$GITHUB_OUTPUT"
          echo "full_version=$FULL_VERSION" >> "$GITHUB_OUTPUT"

      # - name: Validate tag matches version
      #   run: |
      #     TAG="${GITHUB_REF_NAME}"
      #     FULL_VERSION="${{ steps.read-props.outputs.full_version }}"
      #
      #     echo "Validating tag '$TAG' against version '$FULL_VERSION'..."
      #     if [[ "$TAG" != "$FULL_VERSION" ]]; then
      #       echo "::error::Tag '$TAG' does not match version '$FULL_VERSION' in stonecutter.properties.toml"
      #       echo "Deleting tag and release..."
      #
      #       if gh release view "$TAG" &>/dev/null; then
      #         echo "Deleting GitHub release for $TAG..."
      #         gh release delete "$TAG" -y
      #       fi
      #
      #       git push origin ":refs/tags/$TAG"
      #       exit 1
      #     fi
      #     echo "✓ Tag matches version."

      - name: Upload changelog
        uses: actions/upload-artifact@v4
        with:
          name: changelog
          path: CHANGELOG.md

  github-release:
    name: Release to GitHub
    runs-on: ubuntu-latest
    needs: prepare
    if: needs.prepare.outputs.publish_github == 'true'
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: build/libs/

      - name: Download changelog
        uses: actions/download-artifact@v4
        with:
          name: changelog
          path: .

      - name: Create or update GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          echo "Creating or updating release for $TAG"
          # Try to create the release first
          if ! gh release create "$TAG" \
            --title "$TAG" \
            --notes-file CHANGELOG.md \
            --latest \
            --verify-tag \
            ./build/libs/$TAG/*; then

            echo "Release already exists. Updating existing release..."

            # Update release notes and mark as latest
            gh release edit "$TAG" \
              --title "$TAG" \
              --notes-file CHANGELOG.md \
              --latest

            # Re-upload artifacts (delete first to avoid duplicates)
            for FILE in ./build/libs/$TAG/*; do
              NAME=$(basename "$FILE")
              gh release delete-asset "$TAG" "$NAME" -y || true
              gh release upload "$TAG" "$FILE" --clobber
            done
           fi


  platform-release:
    name: Release to Platforms (${{ matrix.version }})
    runs-on: ubuntu-latest
    needs: [ prepare ]
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        # doing this live a caveman
        version:
          - 26.1-forge
          - 26.1-fabric
          - 26.1-neoforge
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: build/libs/

      - name: Download changelog
        uses: actions/download-artifact@v4
        with:
          name: changelog
          path: .

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: 25
          distribution: 'microsoft'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ matrix.version }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-${{ matrix.version }}-
            ${{ runner.os }}-gradle-
      # TODO: Add curseforge page
      - name: Publish to Platforms
        run: |
          ./gradlew ${{ matrix.version }}:publishMods --stacktrace
