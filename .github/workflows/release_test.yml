name: release_test

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  MODRINTH_API_TOKEN: ${{ secrets.MODRINTH_API_TOKEN }}
  CURSEFORGE_API_TOKEN: ${{ secrets.CURSEFORGE_API_TOKEN }}
  TEST_PUBLISHING_WITH_MR_STAGING: ${{ vars.TEST_PUBLISHING_WITH_MR_STAGING }}
  ENABLE_PUBLISHING: false

jobs:
  build:
    uses: ./.github/workflows/build_reusable.yml
  define-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.result }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - id: set-matrix
        name: Set Matrix
        uses: actions/github-script@v9
        with:
          result-encoding: string
          script: |
            const fs = require('fs');
            const path = require('path');

            const modloadersRoot = path.join(process.cwd(), 'modloaders', 'versions');
            const spigotRoot = path.join(process.cwd(), 'spigot', 'versions');

            let folders = [];

            if (fs.existsSync(modloadersRoot)) {
              const modloadersFolders = fs.readdirSync(modloadersRoot, { withFileTypes: true })
                .filter(d => d.isDirectory())
                .map(d => `:modloaders:${d.name}`);
              folders.push(...modloadersFolders);
            }

            if (fs.existsSync(spigotRoot)) {
              const spigotFolders = fs.readdirSync(spigotRoot, { withFileTypes: true })
                .filter(d => d.isDirectory())
                .map(d => `:spigot:${d.name}`);
              folders.push(...spigotFolders);
            }

            console.log(folders)
            core.setOutput('matrix', JSON.stringify({ version: folders }));
            return JSON.stringify(folders);
      - name: Output Matrix
        id: output-matrix
        run: echo "${{ steps.set-matrix.outputs.result }}"
  prepare:
    name: Dryrun Release
    runs-on: ubuntu-latest
    needs: [ build, define-matrix ]
    permissions:
      contents: write

    outputs:
      publish_github: ${{ steps.read-props.outputs.publish_github }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare git-cliff
        run: |
          REPO_URL="https://github.com/${{ github.repository }}"
          sed -i "s|%%%repo_url%%%|${REPO_URL}|g" cliff.toml

      - name: Generate changelog with git-cliff
        id: cliff
        uses: orhun/git-cliff-action@v4
        with:
          args: --latest --strip header --output CHANGELOG.md
          version: 'v2.10.1'

      - name: Read gradle.properties & stonecutter.properties.toml values
        id: read-props
        run: |
          VERSION=$(grep '^mod.version=' stonecutter.properties.toml | cut -d'=' -f2)
          VERSION="${VERSION//\"/}"
          CHANNEL_TAG=$(grep '^mod.channel_tag=' stonecutter.properties.toml | cut -d'=' -f2)
          CHANNEL_TAG="${CHANNEL_TAG//\"/}"
          PUBLISH_GITHUB=$(grep '^publish.github=' gradle.properties | cut -d'=' -f2 || echo "false")
          FULL_VERSION="${VERSION}${CHANNEL_TAG}"

          echo "mod.version=$VERSION"
          echo "mod.channel_tag=$CHANNEL_TAG"
          echo "Combined version=$FULL_VERSION"

          echo "publish_github=$PUBLISH_GITHUB" >> "$GITHUB_OUTPUT"
          echo "full_version=$FULL_VERSION" >> "$GITHUB_OUTPUT"

      - name: Upload changelog
        uses: actions/upload-artifact@v4
        with:
          name: changelog
          path: CHANGELOG.md

  platform-release:
    name: Release to Platforms (${{ matrix.version }})
    runs-on: ubuntu-latest
    needs: [ prepare, define-matrix ]
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        # doing this live a caveman
        version: ${{ fromJSON(needs.define-matrix.outputs.matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: build/libs/

      - name: Download changelog
        uses: actions/download-artifact@v4
        with:
          name: changelog
          path: .

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: 25
          distribution: 'microsoft'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ matrix.version }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-${{ matrix.version }}-
            ${{ runner.os }}-gradle-
      # TODO: Add curseforge page
      - name: Publish to Platforms
        run: |
          ./gradlew ${{ matrix.version }}:publishMods --stacktrace
