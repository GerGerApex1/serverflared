name: reusable-build
on:
  workflow_call:
    outputs:
      artifact-name:
        description: "Name of the uploaded build artifact"
        value: ${{ jobs.collect.outputs.artifact-name }}
      matrix:
        description: "Grouped build matrix JSON"
        value: ${{ jobs.define-matrix.outputs.matrix }}
permissions:
  contents: read

jobs:
  define-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.result }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - id: set-matrix
        name: Set Grouped Matrix
        uses: actions/github-script@v9
        with:
          result-encoding: string
          script: |
            const fs = require('fs');
            const path = require('path');

            const modloadersRoot = path.join(process.cwd(), 'modloaders', 'versions');
            const spigotRoot = path.join(process.cwd(), 'spigot', 'versions');

            const groups = {
              'fabric': [],
              'neoforge': [],
              'forge-legacy': [],
              'forge-modern': [],
              'spigot': []
            };

            if (fs.existsSync(modloadersRoot)) {
              const dirs = fs.readdirSync(modloadersRoot, { withFileTypes: true })
                .filter(d => d.isDirectory())
                .map(d => d.name);

              for (const name of dirs) {
                const proj = `:modloaders:${name}`;
                if (name.endsWith('-fabric')) {
                  groups['fabric'].push(proj);
                } else if (name.endsWith('-neoforge')) {
                  groups['neoforge'].push(proj);
                } else if (name.endsWith('-forge')) {
                  const mcVer = name.slice(0, -'-forge'.length);
                  const parts = mcVer.split('.');
                  const major = parseInt(parts[0], 10);
                  const minor = parseInt(parts[1] || '0', 10);
                  if (major === 1 && minor <= 15) {
                    groups['forge-legacy'].push(proj);
                  } else {
                    groups['forge-modern'].push(proj);
                  }
                } else {
                  groups['forge-modern'].push(proj);
                }
              }
            }

            if (fs.existsSync(spigotRoot)) {
              const dirs = fs.readdirSync(spigotRoot, { withFileTypes: true })
                .filter(d => d.isDirectory())
                .map(d => `:spigot:${d.name}`);
              groups['spigot'].push(...dirs);
            }

            const matrix = Object.entries(groups)
              .filter(([, list]) => list.length > 0)
              .map(([group, list]) => ({
                group,
                versions: list.join(';'),
                build_tasks: list.map(p => `${p}:buildAndCollect`).join(' '),
                publish_tasks: list.map(p => `${p}:publishMods`).join(' ')
              }));

            console.log(matrix);
            return JSON.stringify(matrix);

  build:
    name: Build (${{ matrix.group }})
    needs: define-matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.define-matrix.outputs.matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: 25
          distribution: 'microsoft'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper
          cache-read-only: ${{ github.event_name == 'pull_request' }}
          cache-cleanup: always

      - name: Build with Gradle
        run: ./gradlew ${{ matrix.build_tasks }} -Pci.versions="${{ matrix.versions }}" --parallel --no-daemon

      - name: Prune bulky Loom caches before cache save
        if: always()
        run: |
          rm -rf ~/.gradle/caches/essential-loom \
                 ~/.gradle/caches/fabric-loom \
                 ~/.gradle/caches/minecraft-codev \
                 ~/.gradle/caches/paperweight-userdev \
                 ~/.gradle/caches/*/transforms \
                 ~/.gradle/daemon \
                 .gradle/loom-cache \
                 .gradle/configuration-cache

      - name: Upload batch artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts-${{ matrix.group }}
          path: build/libs/
          retention-days: 7

  collect:
    name: Collect All Artifacts
    runs-on: ubuntu-latest
    needs: build
    outputs:
      artifact-name: build-artifacts

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: build-artifacts-*
          path: collected/
          merge-multiple: true

      - name: Upload combined artifact
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: collected/
