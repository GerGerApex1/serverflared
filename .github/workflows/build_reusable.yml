name: reusable-build
on:
  workflow_call:
    outputs:
      artifact-name:
        description: "Name of the uploaded build artifact"
        value: ${{ jobs.build.outputs.artifact-name }}
permissions:
  contents: read

jobs:
  define-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - id: set-matrix
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const root = path.join('${{ github.workspace }}','modloaders', 'versions');

            const folders = fs.readdirSync(root, { withFileTypes: true })
              .filter(d => d.isDirectory())
              .map(d => d.name);

            core.setOutput('matrix', JSON.stringify({ version: folders }));
  build:
    name: Build Project
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.define-matrix.outputs.matrix) }}
    outputs:
      artifact-name: ${{ steps.upload.outputs.artifact-name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: 25
          distribution: 'microsoft'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ matrix.version }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-${{ matrix.version }}-
            ${{ runner.os }}-gradle-


      - name: Build with Gradle
        run: ./gradlew ${{ matrix.version }}:buildAndCollect --no-daemon

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts-${{ matrix.version }}
          path: build/libs/
  collect:
    name: Collect All Artifacts
    runs-on: ubuntu-latest
    needs: build
    outputs:
      artifact-name: build-artifacts

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: build-*
          path: collected/
          merge-multiple: true

      - name: Upload combined artifact
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: collected/

