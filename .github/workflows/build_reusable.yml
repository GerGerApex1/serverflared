name: reusable-build
on:
  workflow_call:
    outputs:
      artifact-name:
        description: "Name of the uploaded build artifact"
        value: ${{ jobs.build.outputs.artifact-name }}
permissions:
  contents: read

jobs:
  build:
    name: Build Project
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # doing this live a caveman
        version:
          - 1.8.9-forge
          - 1.9-forge
          - 1.10-forge
          - 1.11-forge
          - 1.12-forge
          - 1.14.4-forge
          - 1.15.2-forge
          - 1.16.5-fabric
          - 1.16.5-forge
          - 1.17.1-fabric
          - 1.17.1-forge
          - 1.18.2-fabric
          - 1.18.2-forge
          - 1.19.2-fabric
          - 1.19.2-forge
          - 1.20.2-fabric
          - 1.20.2-forge
          - 1.20.2-neoforge
          - 1.21.1-fabric
          - 1.21.1-forge
          - 1.21.1-neoforge

    outputs:
      artifact-name: ${{ steps.upload.outputs.artifact-name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: 'microsoft'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ matrix.version }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-${{ matrix.version }}-
            ${{ runner.os }}-gradle-


      - name: Build with Gradle
        run: ./gradlew buildAndCollect --no-daemon

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: build-temp/libs/
  collect:
    name: Collect All Artifacts
    runs-on: ubuntu-latest
    needs: build
    outputs:
      artifact-name: build-artifacts

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: build-*
          path: collected/
          merge-multiple: true

      - name: Upload combined artifact
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: collected/

