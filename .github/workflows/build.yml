name: Developmental Builds
on: [ push, pull_request ]
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.ref != 'refs/heads/main' }}

jobs:
  build:
    uses: ./.github/workflows/build_reusable.yml
